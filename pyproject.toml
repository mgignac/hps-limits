[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hps-limits"
version = "0.1.0"
description = "CLs upper limit setting for HPS search results using pyhf"
requires-python = ">=3.9"
dependencies = [
    "pyhf[contrib]>=0.7.6",
    "numpy>=1.24",
]

[project.optional-dependencies]
plotting = [
    "matplotlib>=3.6",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hps_limits"]
