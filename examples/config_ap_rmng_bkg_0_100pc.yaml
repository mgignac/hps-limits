# HPS Limits — nominal A′, L1L1, zero-background — scenario rmng_bkg_0, 100% lumi
#
# Optimization strategy "remaining background = 0".  Signal scaled 10% → 100%.
#   signal_scale = L(full)/L(10%) = 161.799 / 18.0109 = 8.983393389558545
#   python3.9 scripts/run_limits.py --config examples/config_ap_rmng_bkg_0_100pc.yaml

label: "HPS A' (L1L1, rmng_bkg=0, 100% lumi)"
mode: classic
signal_format: ap_displaced

output_dir: ../plots/ap_rmng_bkg_0_100pc

signal_jsons:
  - file:   ../data/sarah-latest/rmng_bkg_0/ap_displaced_yield__l1l1_mass_window_min_y0_vtx_proj_scaled_10pct.json
    region: L1L1
  - file:   ../data/sarah-latest/rmng_bkg_0/ap_displaced_yield__l1l2_mass_window_min_y0_vtx_proj_scaled_10pct.json
    region: L1L2
  - file:   ../data/sarah-latest/rmng_bkg_0/ap_displaced_yield__l2l2_mass_window_min_y0_vtx_proj_scaled_10pct.json
    region: L2L2

simps: false
per_region: true
run_cls: false
run_mu: true
mu_cap: 10000.0
cl_level: 0.90

zero_background: true
signal_scale: 8.983393389558545

bkg_zero_floor: false
summary_plot: false
prior_exclusions: []
