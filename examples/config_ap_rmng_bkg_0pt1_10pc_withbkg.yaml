# HPS Limits — A′ L1L1+L1L2+L2L2, rmng_bkg=0.1, 10%, with measured background counts
#
# Same signal as config_ap_rmng_bkg_0pt1_10pc.yaml, but instead of the
# zero-background assumption the per-(region,mass) background is taken from the
# event-count tables (Poly Cut column), converted to JSON by
# scripts/eventcount_to_background_json.py.  Observed = background (Asimov).
#
#   python3.9 scripts/run_limits.py --config examples/config_ap_rmng_bkg_0pt1_10pc_withbkg.yaml

label: "HPS A' (rmng_bkg=0.1, 10%, with bkg)"
mode: classic
signal_format: ap_displaced

output_dir: ../plots/ap_rmng_bkg_0pt1_10pc_withbkg

signal_jsons:
  - file:   ../data/sarah-latest/rmng_bkg_0pt1/ap_displaced_yield__l1l1_mass_window_min_y0_vtx_proj_scaled_10pct.json
    region: L1L1
  - file:   ../data/sarah-latest/rmng_bkg_0pt1/ap_displaced_yield__l1l2_mass_window_min_y0_vtx_proj_scaled_10pct.json
    region: L1L2
  - file:   ../data/sarah-latest/rmng_bkg_0pt1/ap_displaced_yield__l2l2_mass_window_min_y0_vtx_proj_scaled_10pct.json
    region: L2L2

# Measured background (Poly Cut counts; Asimov observed = bkg)
background_json: ../data/sarah-latest/rmng_bkg_0pt1/background_counts.json

simps: false
per_region: true
run_cls: false
run_mu: true
mu_cap: 10000.0
cl_level: 0.90

zero_background: false              # use the background_json above
signal_scale: 1.0                   # 10%

bkg_zero_floor: false
summary_plot: false
prior_exclusions: []
